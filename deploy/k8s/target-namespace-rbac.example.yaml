# Apply one copy in every namespace selected as a Plan target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forklift-migration-console-target
  namespace: REPLACE_TARGET_NAMESPACE
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forklift-migration-console-target
  namespace: REPLACE_TARGET_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forklift-migration-console-target
subjects:
  - kind: ServiceAccount
    name: forklift-migration-console
    namespace: REPLACE_FORKLIFT_NAMESPACE
