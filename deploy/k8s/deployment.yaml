apiVersion: apps/v1
kind: Deployment
metadata:
  name: forklift-migration-console
  labels:
    app.kubernetes.io/name: forklift-migration-console
    app.kubernetes.io/part-of: forklift
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forklift-migration-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forklift-migration-console
        app.kubernetes.io/part-of: forklift
    spec:
      serviceAccountName: forklift-migration-console
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: forklift-migration-console
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /tmp/ca-bundle.crt
              if [ -f /var/run/secrets/inventory-ca/ca.crt ]; then
                cat /var/run/secrets/inventory-ca/ca.crt >> /tmp/ca-bundle.crt
              fi
              exec node server/index.mjs
          envFrom:
            - configMapRef:
                name: forklift-migration-console-config
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: NODE_EXTRA_CA_CERTS
              value: /tmp/ca-bundle.crt
            - name: K8S_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: CONSOLE_PASSWORD_FILE
              value: /var/run/secrets/console-auth/password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: inventory-ca
              mountPath: /var/run/secrets/inventory-ca
              readOnly: true
            - name: console-auth
              mountPath: /var/run/secrets/console-auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: inventory-ca
          secret:
            secretName: forklift-inventory-serving-cert
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: console-auth
          secret:
            secretName: forklift-migration-console-auth
            items:
              - key: password
                path: password
