apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forklift-migration-console
rules:
  - apiGroups: ["forklift.konveyor.io"]
    resources:
      - providers
      - networkmaps
      - storagemaps
      - plans
      - migrations
      - hosts
      - hooks
      - conversions
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["forklift.konveyor.io"]
    resources: ["forkliftcontrollers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forklift-migration-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forklift-migration-console
subjects:
  - kind: ServiceAccount
    name: forklift-migration-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forklift-migration-console-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forklift-migration-console-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forklift-migration-console-namespace-reader
subjects:
  - kind: ServiceAccount
    name: forklift-migration-console
    namespace: konveyor-forklift
