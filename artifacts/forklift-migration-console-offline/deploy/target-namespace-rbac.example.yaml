# Apply one copy in every namespace selected as a Plan target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forklift-migration-console-target
  namespace: REPLACE_TARGET_NAMESPACE
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forklift-migration-console-target
  namespace: REPLACE_TARGET_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forklift-migration-console-target
subjects:
  - kind: ServiceAccount
    name: forklift-migration-console
    namespace: konveyor-forklift
